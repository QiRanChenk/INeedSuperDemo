# Run the SuperDemo shell on a server / NAS:  cp .env.example .env  (set SUPERDEMO_PASSWORD)  &&  docker compose up -d --build
services:
  superdemo:
    build: .
    image: superdemo:latest
    container_name: superdemo
    restart: unless-stopped
    init: true # reaps the project processes / shell commands the agent spawns
    ports:
      - "${HOST_PORT:-18788}:3000"
      # demo previews and share links live on their own port (another origin), isolated from the shell
      - "${DEMO_HOST_PORT:-18789}:3001"
    environment:
      HOST: 0.0.0.0
      SUPERDEMO_DEMO_PORT: 3001
      SUPERDEMO_DEMO_PUBLIC_PORT: ${DEMO_HOST_PORT:-18789}
      # A sign-in method is required when listening beyond loopback (the agent can run commands):
      # 统一登录 (Casdoor OIDC) and/or the shared access password (fallback, rate-limited).
      SUPERDEMO_PASSWORD: ${SUPERDEMO_PASSWORD:-}
      SUPERDEMO_OIDC_ISSUER: ${SUPERDEMO_OIDC_ISSUER:-}
      SUPERDEMO_OIDC_CLIENT_ID: ${SUPERDEMO_OIDC_CLIENT_ID:-}
      SUPERDEMO_OIDC_CLIENT_SECRET: ${SUPERDEMO_OIDC_CLIENT_SECRET:-}
      SUPERDEMO_OIDC_INTERNAL_URL: ${SUPERDEMO_OIDC_INTERNAL_URL:-}
      SUPERDEMO_OIDC_ORGANIZATION: ${SUPERDEMO_OIDC_ORGANIZATION:-}
      SUPERDEMO_APP_ORIGINS: ${SUPERDEMO_APP_ORIGINS:-}
      SUPERDEMO_TRUST_PROXY: ${SUPERDEMO_TRUST_PROXY:-}
      # addresses (relay / direct) of the shell and of the demo origin; empty = old "this host + demo port" behaviour
      SUPERDEMO_PUBLIC_URL: ${SUPERDEMO_PUBLIC_URL:-}
      SUPERDEMO_DEMO_PUBLIC_URL: ${SUPERDEMO_DEMO_PUBLIC_URL:-}
      SUPERDEMO_DIRECT_URL: ${SUPERDEMO_DIRECT_URL:-}
      SUPERDEMO_DEMO_DIRECT_URL: ${SUPERDEMO_DEMO_DIRECT_URL:-}
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data           # settings (model / API key), token usage log
      - ./projects:/app/projects   # generated demo projects incl. their databases, sessions and versions
      # Code is bind-mounted so an upgrade is "sync files + restart"; node_modules stay in the image.
      # (Comment these three lines out to run purely from the image.)
      - ./shell:/app/shell:ro
      - ./sdk:/app/sdk:ro
      - ./templates:/app/templates:ro
