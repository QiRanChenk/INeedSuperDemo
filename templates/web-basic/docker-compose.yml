# 独立部署：docker compose up -d --build
# 模型配置写在同目录 .env（参考 .env.example），数据持久化在 ./data
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: "3000"
      SUPERDEMO_PROJECT_NAME: "${SUPERDEMO_PROJECT_NAME:-Demo}"
      SUPERDEMO_LLM_BASE_URL: "${SUPERDEMO_LLM_BASE_URL}"
      SUPERDEMO_LLM_API_KEY: "${SUPERDEMO_LLM_API_KEY}"
      SUPERDEMO_LLM_MODEL: "${SUPERDEMO_LLM_MODEL}"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
